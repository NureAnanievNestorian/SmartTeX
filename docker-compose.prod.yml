services:
  db:
    image: postgres:16-alpine
    container_name: smarttex-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  plantuml:
    image: plantuml/plantuml-server:jetty
    container_name: smarttex-plantuml
    restart: unless-stopped

  web:
    image: ${SMARTTEX_IMAGE}
    container_name: smarttex-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      plantuml:
        condition: service_started
    env_file:
      - .env
    environment:
      PLANTUML_URL: http://plantuml:8080
      COMPILE_CONCURRENCY: ${COMPILE_CONCURRENCY:-1}
      TINYMIST_LSP_ENABLED: ${TINYMIST_LSP_ENABLED:-true}
      TINYMIST_PREVIEW_ENABLED: ${TINYMIST_PREVIEW_ENABLED:-true}
      TINYMIST_LSP_AUTOSTART: ${TINYMIST_LSP_AUTOSTART:-false}
      TINYMIST_PREVIEW_AUTOSTART: ${TINYMIST_PREVIEW_AUTOSTART:-false}
      TINYMIST_API_SESSION_PERSIST: ${TINYMIST_API_SESSION_PERSIST:-false}
      TINYMIST_SESSION_IDLE_TIMEOUT: ${TINYMIST_SESSION_IDLE_TIMEOUT:-60}
      TINYMIST_CLOSE_ON_WS_DISCONNECT: ${TINYMIST_CLOSE_ON_WS_DISCONNECT:-true}
    ports:
      - "${WEB_PORT:-8000}:8000"
    mem_limit: ${WEB_MEMORY_LIMIT:-1400m}
    cpus: ${WEB_CPUS:-1.0}
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py install_typst_packages && uvicorn SmartTeX.asgi:application --host 0.0.0.0 --port 8000"
    volumes:
      - /opt/smarttex/static:/app/staticfiles
      - /opt/smarttex/media:/app/media
      - "${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
      - /opt/smarttex/typst-packages:/opt/smarttex/typst-packages

  mcp:
    image: ${SMARTTEX_IMAGE}
    container_name: smarttex-mcp
    restart: unless-stopped
    depends_on:
      - web
    env_file:
      - .env
    environment:
      COMPILE_CONCURRENCY: ${COMPILE_CONCURRENCY:-1}
      TINYMIST_LSP_ENABLED: ${TINYMIST_LSP_ENABLED:-true}
      TINYMIST_PREVIEW_ENABLED: ${TINYMIST_PREVIEW_ENABLED:-true}
      TINYMIST_LSP_AUTOSTART: ${TINYMIST_LSP_AUTOSTART:-false}
      TINYMIST_PREVIEW_AUTOSTART: ${TINYMIST_PREVIEW_AUTOSTART:-false}
      TINYMIST_API_SESSION_PERSIST: ${TINYMIST_API_SESSION_PERSIST:-false}
    command: python mcp_http_server.py
    mem_limit: ${MCP_MEMORY_LIMIT:-384m}
    cpus: ${MCP_CPUS:-0.5}
    ports:
      - "${MCP_PORT:-9000}:${MCP_PORT:-9000}"

volumes:
  postgres_data:
