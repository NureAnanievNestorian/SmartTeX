name: SmartTeX Local Agent Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Update channel"
        required: true
        default: "stable"
  push:
    tags:
      - "smarttex-local-v*"

jobs:
  build-local-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: local_agent/go/go.mod
          cache-dependency-path: local_agent/go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build static update assets
        env:
          SMARTTEX_LOCAL_UPDATE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
        run: |
          chmod +x local_agent/go/scripts/build-release-assets.sh
          local_agent/go/scripts/build-release-assets.sh

      - name: Upload local agent assets
        uses: actions/upload-artifact@v4
        with:
          name: smarttex-local-agent-${{ github.event.inputs.channel || 'stable' }}
          path: projects/static/local-agent/${{ github.event.inputs.channel || 'stable' }}/

      - name: Deploy local agent assets to VPS
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"

          install -m 0700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/smarttex_vps_key
          chmod 0600 ~/.ssh/smarttex_vps_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          deploy_path="/opt/smarttex/static/local-agent"
          ssh -i ~/.ssh/smarttex_vps_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$deploy_path/$CHANNEL'"
          rsync -az --delete -e "ssh -i ~/.ssh/smarttex_vps_key" \
            "projects/static/local-agent/$CHANNEL/" \
            "$DEPLOY_USER@$DEPLOY_HOST:$deploy_path/$CHANNEL/"

          echo "Local agent assets deployed to $deploy_path/$CHANNEL"
